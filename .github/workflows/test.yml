name: Read-only analyzer tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test locally (no target network requests)
        run: |
          python -m py_compile analyze.py
          python -m unittest discover -s tests -v
      - name: Integration test using saved source snapshots (offline)
        run: |
          python analyze.py --local research
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/analysis.json").read_text(encoding="utf-8"))
          records = data["files"]
          js_files = [r for r in records if r["classification"] == "JS_SOURCE"]
          endpoints = {p for r in records for p in r["api_paths"]}
          assert len(js_files) >= 20, (len(js_files), len(records))
          assert "local_form/read_doc_company" in endpoints, endpoints
          assert "/api/verify/" in endpoints, endpoints
          assert any(r["name"].startswith("6439.3d46893d") and
                     r["classification"] == "JS_SOURCE" for r in records)
          assert any(r["name"].startswith("QRDocument-") and
                     r["classification"] == "JS_SOURCE" for r in records)
          assert all(r.get("relative_path") for r in records)
          print("Offline integration OK:", len(js_files),
                "JavaScript files,", len(endpoints), "API references")
          PY
      - name: Scan archived JavaScript without network access
        run: |
          python analyze.py --local .
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("reports/analysis.json").read_text(encoding="utf-8"))
          assert payload.get("static_read_only") is True
          records = payload["files"]
          by_path = {item["relative_path"]: item for item in records}
          required = {
              "research/raw-uploads/2026-11-07/6439.3d46893d(1).js": "/api/verify/",
              "research/source-archive/2026-11-07/uboor/QRLocal-5TAaXbzM.js": "local_form/read_doc_company",
              "research/source-archive/2026-11-07/uboor/QRDocument-BJwpoEJY.js": "local_form/refuse_doc_company",
          }
          assert len(records) >= 20, f"unexpected scan coverage: {len(records)}"
          for path, expected_endpoint in required.items():
              item = by_path.get(path)
              assert item is not None, f"missing file in recursive scan: {path}"
              assert item["classification"] == "JS_SOURCE", path
              assert expected_endpoint in item["api_paths"], (
                  f"{path} missing {expected_endpoint}: {item['api_paths']}"
              )
          print(f"Offline scan verified: {len(records)} archived/source records")
          PY

      - name: Check iSH update script syntax and checkout selection
        run: |
          sh -n tools/ish/sync_and_audit.sh
          sh -n tools/ish/connect_remote.sh
          sh -n tools/ish/upload_onedrive_archive_private.sh
          sh tools/ish/connect_remote.sh --check
          selected="$(sh tools/ish/sync_and_audit.sh --where)"
          test "$selected" = "$PWD"
          selected="$(STAR_AUDIT_DIR=/tmp/star-audit-custom sh tools/ish/sync_and_audit.sh --where)"
          test "$selected" = "/tmp/star-audit-custom"
      - name: Summarize offline scan in GitHub Actions
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("reports/analysis.json").read_text(encoding="utf-8"))
          files = report.get("files", [])
          js_files = [item for item in files if item.get("classification") == "JS_SOURCE"]
          apis = {p for item in files for p in item.get("api_paths", [])}
          flags = sum(len(item.get("flags", [])) for item in files)
          summary = (
              "## Star Cyber Audit — offline archive check\n\n"
              "| Metric | Value |\n|---|---:|\n"
              f"| Files inspected | {len(files)} |\n"
              f"| JavaScript sources | {len(js_files)} |\n"
              f"| API references (unique) | {len(apis)} |\n"
              f"| Heuristic review flags | {flags} |\n\n"
              "Source: archived repository files only. No authenticated requests, "
              "no scans of external services. Heuristic flags are **not proven vulnerabilities**.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          PY
      - name: Upload offline audit reports
        uses: actions/upload-artifact@v4
        with:
          name: star-cyber-audit-offline-reports
          path: |
            reports/analysis.json
            reports/inventory.csv
            reports/api_paths.txt
            reports/review_flags.txt
            reports/report.html
          if-no-files-found: error
          retention-days: 14
