name: Cloudflare Dashboard V2 Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard-v2:
    name: V2 Worker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker syntax
        run: node --check site/worker-v2.mjs
      - name: Test offline routing and browser privacy contract
        run: node tests/worker_v2.test.mjs
